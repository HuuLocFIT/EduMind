<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>

    <!--
      Strip prerendered SEO tags before React 19 hydrates.
      React 19 cannot reliably adopt prerendered SEO tags, causing duplicates
      in both initial render and client-side navigation.
      Crawlers (no JS) still receive the prerendered HTML with full SEO tags.
    -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var selectors = [
          'title',
          'meta[name="description"]',
          'meta[name="robots"]',
          'meta[name="prerender-status-code"]',
          'meta[name^="twitter:"]',
          'meta[property^="og:"]',
          'link[rel="canonical"]',
          'script[type="application/ld+json"]'
        ];
        selectors.forEach(function(selector) {
          document.head.querySelectorAll(selector).forEach(function(el) {
            el.remove();
          });
        });
      }, { once: true });
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font-family: Inter, sans-serif; text-align: center;">
        <h1>EduMind requires JavaScript</h1>
        <p>Please enable JavaScript in your browser settings to access the platform.</p>
        <p>
          <a href="https://www.enablejavascript.io" rel="noopener noreferrer" target="_blank">
            Learn how to enable JavaScript
          </a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
