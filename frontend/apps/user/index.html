<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="font-css" rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>

    <!--
      Applies the font stylesheet and strips prerendered SEO tags before
      React hydrates. Kept as an external file (no inline scripts) so the
      CSP in vercel.json does not need script-src 'unsafe-inline'.
    -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font-family: Inter, sans-serif; text-align: center;">
        <h1>EduMind requires JavaScript</h1>
        <p>Please enable JavaScript in your browser settings to access the platform.</p>
        <p>
          <a href="https://www.enablejavascript.io" rel="noopener noreferrer" target="_blank">
            Learn how to enable JavaScript
          </a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
