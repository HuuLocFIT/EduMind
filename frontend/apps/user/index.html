<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>

    <!--
      Hydration cleanup for prerendered SEO tags.
      React 19 hoisting cannot reliably adopt prerendered static SEO tags,
      so we remove any SEO tags not created by React before React hydrates.
      React-managed tags are marked with data-seo="react".
    -->
    <script>
      (function () {
        if (!document.head) return;

        var DEBUG = true;
        var REACT_SEO_MARKER = 'react';

        function isReactManaged(el) {
          return el.getAttribute('data-seo') === REACT_SEO_MARKER;
        }

        function isSeoMeta(el) {
          var name = el.getAttribute('name');
          var property = el.getAttribute('property');
          if (name === 'description') return true;
          if (name === 'robots') return true;
          if (name === 'prerender-status-code') return true;
          if (name && name.indexOf('twitter:') === 0) return true;
          if (property && property.indexOf('og:') === 0) return true;
          return false;
        }

        function removeAll(selector, shouldRemove) {
          var elements = document.head.querySelectorAll(selector);
          var removed = 0;
          for (var i = 0; i < elements.length; i++) {
            if (shouldRemove(elements[i])) {
              document.head.removeChild(elements[i]);
              removed++;
            }
          }
          return removed;
        }

        var removedTitles = removeAll('title', function (el) { return !isReactManaged(el); });
        var removedMetas = removeAll('meta', function (el) { return isSeoMeta(el) && !isReactManaged(el); });
        var removedCanonicals = removeAll('link[rel="canonical"]', function (el) { return !isReactManaged(el); });
        var removedJsonLds = removeAll('script[type="application/ld+json"]', function (el) { return !isReactManaged(el); });

        if (DEBUG) {
          console.log(
            '[SEO cleanup] Removed prerendered tags:',
            'titles=' + removedTitles,
            'metas=' + removedMetas,
            'canonicals=' + removedCanonicals,
            'jsonLd=' + removedJsonLds
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
