@switch (viewState()) {
  @case ('loading') {
    <div data-testid="admin-boot-loading" role="status" aria-live="polite" class="admin-boot-loading">
      <span class="sr-only">Verifying your session…</span>
    </div>
  }
  @case ('retry') {
    <div data-testid="admin-boot-retry" role="alert" class="admin-boot-retry">
      <p>We couldn't verify your session. Check your connection and try again.</p>
      <button type="button" (click)="retryBoot()">Retry</button>
    </div>
  }
  @case ('mismatch') {
    <app-portal-mismatch />
  }
  @default {
    <router-outlet></router-outlet>
  }
}
