<div class="space-y-5 md:space-y-6 text-neutral-900">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div class="space-y-1">
      <h1 class="text-2xl font-bold text-neutral-900">Create Payout</h1>
      <p class="text-neutral-600 text-sm">Create a new payout for an instructor.</p>
    </div>
  </div>

  <!-- Alerts -->
  @if (successMessage()) {
    <app-alert variant="success" [message]="successMessage()" [dismissible]="true" (onClose)="successMessage.set('')" />
  }
  @if (errorMessage()) {
    <app-alert variant="error" [message]="errorMessage()" [dismissible]="true" (onClose)="errorMessage.set('')" />
  }

  <!-- Form -->
  <app-card [padding]="'md'" [variant]="'bordered'" [customClass]="'mt-4'">
    <form [formGroup]="payoutForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Instructor ID -->
      <div>
        <app-input
          label="Instructor ID"
          type="number"
          formControlName="instructorId"
          placeholder="Enter instructor ID"
          [required]="true"
          [error]="getFieldError('instructorId')"
        />
      </div>

      <!-- Payment Method -->
      <div>
        <app-select
          label="Payment Method"
          [options]="paymentMethodOptions"
          formControlName="paymentMethod"
          [required]="true"
          [size]="'md'"
          [error]="getFieldError('paymentMethod')"
        />
      </div>

      <!-- Conditional Fields -->
      @if (paymentMethod === PayoutMethod.BANK_TRANSFER) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <app-input
              label="Bank Name"
              type="text"
              formControlName="bankName"
              placeholder="Enter bank name"
              [required]="true"
              [error]="getFieldError('bankName')"
            />
          </div>

          <div class="md:col-span-2">
            <app-input
              label="Account Holder Name"
              type="text"
              formControlName="accountHolderName"
              placeholder="Enter account holder name"
              [required]="true"
              [error]="getFieldError('accountHolderName')"
            />
          </div>

          <div class="md:col-span-2">
            <app-input
              label="Bank Account / Account Number"
              type="text"
              formControlName="bankAccount"
              placeholder="Enter bank account number"
              [required]="true"
              [error]="getFieldError('bankAccount')"
            />
          </div>

          <div>
            <app-input
              label="SWIFT Code (optional)"
              type="text"
              formControlName="swiftCode"
              placeholder="Enter SWIFT/BIC code"
            />
          </div>

          <div>
            <app-input
              label="Bank Address (optional)"
              type="text"
              formControlName="bankAddress"
              placeholder="Enter bank branch address"
            />
          </div>
        </div>
      }

      @if (paymentMethod === PayoutMethod.PAYPAL) {
        <div>
          <app-input
            label="PayPal Email"
            type="email"
            formControlName="paypalEmail"
            placeholder="Enter PayPal email address"
            [required]="true"
            [error]="getFieldError('paypalEmail')"
          />
        </div>
      }

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4 border-t border-neutral-200">
        <app-button variant="outline" type="button" (click)="onCancel()">
          Cancel
        </app-button>
        <app-button variant="primary" type="submit" [disabled]="payoutForm.invalid">
          Create
        </app-button>
      </div>
    </form>
  </app-card>
</div>
