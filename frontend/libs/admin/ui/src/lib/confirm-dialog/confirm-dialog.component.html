<app-modal
  [isOpen]="isOpen"
  [showCloseButton]="false"
  size="sm"
  (close)="onCancel()"
>
  <div class="text-center">
    <!-- Icon -->
    <div
      [class]="
        'mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4 ' +
        config.iconClass
      "
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="config.iconPath"
        />
      </svg>
    </div>

    <!-- Content -->
    <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ title }}</h3>
    <p class="text-sm text-gray-600">{{ message }}</p>
  </div>

  <!-- Footer -->
  <app-modal-footer className="mt-6 border-t-0 bg-transparent p-0">
    <button
      (click)="onCancel()"
      [disabled]="isLoading"
      class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ cancelText }}
    </button>
    <button
      (click)="onConfirm()"
      [disabled]="isLoading"
      [class]="
        'px-4 py-2 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed ' +
        config.buttonClass
      "
    >
      <span *ngIf="!isLoading">{{ confirmText }}</span>
      <span *ngIf="isLoading" class="flex items-center">
        <svg
          class="animate-spin -ml-1 mr-2 h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Processing...
      </span>
    </button>
  </app-modal-footer>
</app-modal>
