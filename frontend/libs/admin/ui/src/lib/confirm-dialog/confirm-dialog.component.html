<app-modal
  [isOpen]="isOpen"
  [showCloseButton]="false"
  size="sm"
  (close)="onCancel()"
>
  <!-- Icon + Content -->
  <div class="flex flex-col items-center text-center px-2 pt-2 pb-6">
    <div
      [class]="
        'w-16 h-16 rounded-full flex items-center justify-center mb-5 ' +
        config.iconWrapperClass
      "
    >
      <svg
        [class]="'w-7 h-7 ' + config.iconClass"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          [attr.d]="config.iconPath"
        />
      </svg>
    </div>

    <h3 class="text-lg font-semibold text-gray-900 mb-2 leading-snug">{{ title }}</h3>
    <p class="text-sm text-gray-500 leading-relaxed max-w-xs">{{ message }}</p>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 px-2 pb-2">
    <button
      (click)="onCancel()"
      [disabled]="isLoading"
      class="flex-1 px-4 py-2 text-sm font-semibold text-gray-700 bg-white border-2 border-gray-200 rounded-lg hover:bg-gray-50 hover:border-gray-300 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ cancelText }}
    </button>
    <button
      (click)="onConfirm()"
      [disabled]="isLoading"
      [class]="
        'flex-1 px-4 py-2 text-sm font-semibold rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed ' +
        config.buttonClass
      "
    >
      <span *ngIf="!isLoading">{{ confirmText }}</span>
      <span *ngIf="isLoading" class="inline-flex items-center justify-center gap-2">
        <svg
          class="animate-spin h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Processing...
      </span>
    </button>
  </div>
</app-modal>
