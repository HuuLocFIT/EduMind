server:
  port: ${DISCOVERY_SERVER_PORT:8761}
  # Stop accepting new requests and let in-flight ones finish on SIGTERM
  shutdown: graceful

spring:
  application:
    name: service-discovery
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    user:
      # Dev defaults. The prod profile requires EUREKA_USERNAME/EUREKA_PASSWORD.
      name: ${EUREKA_USERNAME:eureka}
      password: ${EUREKA_PASSWORD:eureka}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Dev settings: instances disappear from the registry quickly after a restart.
    # See application-prod.yml for the production-safe policy.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

# Logging Configuration
# Appenders, patterns, and rotation live in logback-spring.xml; only levels are set here.
logging:
  level:
    root: INFO
    com.edumind: DEBUG
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Details require HTTP Basic credentials; the container health check only needs the status.
      # No `roles` restriction: any authenticated user may read the details.
      show-details: when-authorized
