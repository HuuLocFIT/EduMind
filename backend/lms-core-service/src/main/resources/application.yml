server:
  port: ${LMS_CORE_SERVICE_PORT:8083}
  servlet:
    context-path: /

spring:
  application:
    name: lms-core-service

  datasource:
    url: ${LMS_CORE_DB_URL:jdbc:postgresql://localhost:5433/edumind_core}
    username: ${LMS_CORE_DB_USERNAME:postgres}
    password: ${LMS_CORE_DB_PASSWORD}
    driver-class-name: ${LMS_CORE_DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      schema: course,assessment,gamification,payment,notification,ai,public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: course,assessment,gamification,payment,notification,ai,public
    create-schemas: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # AI Module (Google GenAI / AI Studio) - optional, app starts without if not configured
  ai:
    retry:
      max-attempts: 1          # disable Spring AI's built-in retry (our processor handles its own)
      on-client-errors: false  # don't retry on 4xx (429 rate-limit, 404 model not found)
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash-lite
            temperature: 0.3
            max-output-tokens: 4096
        embedding:
          options:
            model: text-embedding-004

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration (for validation only, not generation)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Logging
logging:
  level:
    com.edumind.lms: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/lms-core-service.log
    max-size: 10MB
    max-history: 30

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# AI Executor Configuration
ai:
  executor:
    ai-core-pool-size: ${AI_CORE_POOL_SIZE:2}
    ai-max-pool-size: ${AI_MAX_POOL_SIZE:5}
    ai-queue-capacity: ${AI_QUEUE_CAPACITY:50}
    whisper-queue-capacity: ${WHISPER_QUEUE_CAPACITY:10}

app:
  encryption:
    key: ${LMS_CORE_SERVICE_ENCRYPTION_KEY}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:10}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:20}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:50}
  review:
    auto-approve-enabled: ${REVIEW_AUTO_APPROVE_ENABLED:true}
    auto-approve-threshold: ${REVIEW_AUTO_APPROVE_THRESHOLD:0}

# Payment Gateway Configuration
payment:
  # Default gateway used when payment method not specified
  gateway: ${PAYMENT_GATEWAY:mock}  # mock | paypal | sepay

  # Mock Gateway (for development/testing)
  mock:
    enabled: ${PAYMENT_MOCK_ENABLED:true}  # Enable Mock gateway
    delay-ms: 1500                  # Simulate processing delay
    success-rate: 0.95              # 95% success rate for testing
    # Test card numbers:
    # - Ends with 0000: Always success
    # - Ends with 1111: Always fail
    # - Others: Based on success-rate

  # PayPal Configuration
  paypal:
    enabled: ${PAYMENT_PAYPAL_ENABLED:false}  # Enable PayPal gateway
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    mode: ${PAYPAL_MODE:sandbox}    # sandbox | live
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
    return-base-url: ${PAYPAL_RETURN_BASE_URL:}

  # SePay Configuration (Vietnam QR Payment)
  sepay:
    enabled: ${PAYMENT_SEPAY_ENABLED:false}  # Enable SePay gateway
    api-key: ${SEPAY_API_KEY:}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    base-url: ${SEPAY_BASE_URL:https://my.sepay.vn}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    bank-code: ${SEPAY_BANK_CODE:}
    bank-account: ${SEPAY_BANK_ACCOUNT:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    qr-expire-minutes: 15
    template: compact2

  # Refund Policy Configuration
  refund:
    auto-approve-days: ${PAYMENT_REFUND_AUTO_APPROVE_DAYS:7}  # Days within which refund is auto-approved
    max-refund-days: ${PAYMENT_REFUND_MAX_DAYS:30}  # Maximum days after purchase for refund eligibility
    partial-refund-threshold: ${PAYMENT_REFUND_PARTIAL_THRESHOLD:50}  # Course access % threshold for partial refunds

  # Payout Configuration
  payout:
    minimum-amount: ${PAYMENT_PAYOUT_MINIMUM_AMOUNT:50}  # Minimum payout amount in USD
    hold-period-days: ${PAYMENT_PAYOUT_HOLD_PERIOD:30}  # Days before earnings become available
    schedule-day: ${PAYMENT_PAYOUT_SCHEDULE_DAY:1}  # Day of month to process payouts (1-31)
    schedule-hour: ${PAYMENT_PAYOUT_SCHEDULE_HOUR:2}  # Hour of day to process payouts (0-23)
    max-retries: ${PAYMENT_PAYOUT_MAX_RETRIES:3}  # Maximum retry attempts for failed payouts