server:
  port: ${LMS_CORE_SERVICE_PORT:8083}
  servlet:
    context-path: /

spring:
  application:
    name: lms-core-service

  datasource:
    url: ${LMS_CORE_DB_URL:jdbc:postgresql://localhost:5433/edumind_core}
    username: ${LMS_CORE_DB_USERNAME:postgres}
    password: ${LMS_CORE_DB_PASSWORD}
    driver-class-name: ${LMS_CORE_DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      schema: course,assessment,gamification,payment,notification,public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: course,assessment,gamification,payment,notification,public
    create-schemas: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration (for validation only, not generation)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Logging
logging:
  level:
    com.edumind.lms: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/lms-core-service.log
    max-size: 10MB
    max-history: 30

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  encryption:
    key: ${LMS_CORE_SERVICE_ENCRYPTION_KEY}
  review:
    auto-approve-enabled: ${REVIEW_AUTO_APPROVE_ENABLED:true}
    auto-approve-threshold: ${REVIEW_AUTO_APPROVE_THRESHOLD:0}