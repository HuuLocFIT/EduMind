# Production Docker Compose — uses prebuilt images from GitHub Container Registry (GHCR)
# Usage: IMAGE_TAG=<short-sha> docker compose -f docker-compose.prod.yml up -d
# IMAGE_TAG is required so production never deploys the mutable "latest" tag.

services:
  # Discovery Service (Eureka Server) — start first
  discovery-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER is required}/edumind-discovery-service:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: edumind-discovery-service
    # No host port mapping on purpose: the registry is only reachable from
    # edumind-network. Use `docker compose exec` or an SSH tunnel to open the dashboard.
    expose:
      - "${DISCOVERY_SERVER_PORT:-8761}"
    # EUREKA_USERNAME/EUREKA_PASSWORD come from env_file, like every other
    # service — keeps credential parsing identical everywhere. Resolving
    # them here via ${VAR} instead goes through compose's separate
    # variable-substitution parser, which can disagree with env_file's
    # parser on values containing special characters and silently
    # register a different password than the other services send.
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DISCOVERY_SERVER_PORT=${DISCOVERY_SERVER_PORT:-8761}
      - EUREKA_HOSTNAME=discovery-service
      - JAVA_OPTS=${DISCOVERY_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    volumes:
      - discovery-logs:/app/logs
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${DISCOVERY_SERVER_PORT:-8761}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # PostgreSQL for Auth Service
  postgres-auth:
    image: postgres:16-alpine
    container_name: edumind-postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-edumind_auth}
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL for LMS Core Service (with pgvector)
  postgres-lms-core:
    image: pgvector/pgvector:pg16
    container_name: edumind-postgres-lms-core
    environment:
      POSTGRES_DB: ${LMS_CORE_DB_NAME:-edumind_core}
      POSTGRES_USER: ${LMS_CORE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${LMS_CORE_DB_PASSWORD:?LMS_CORE_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-lms-core-data:/var/lib/postgresql/data
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for API Gateway Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: edumind-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER is required}/edumind-auth-service:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: edumind-auth-service
    env_file: .env
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-8081}
      - AUTH_DB_URL=jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-edumind_auth}
      - AUTH_DB_USERNAME=${AUTH_DB_USERNAME:-postgres}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      - AUTH_DB_DRIVER=org.postgresql.Driver
      - EUREKA_DEFAULT_ZONE=http://discovery-service:${DISCOVERY_SERVER_PORT:-8761}/eureka/
      - EUREKA_USERNAME=${EUREKA_USERNAME:?EUREKA_USERNAME is required}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM:-noreply@edumind.com}
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - AUTH_SERVICE_ENCRYPTION_KEY=${AUTH_SERVICE_ENCRYPTION_KEY:?AUTH_SERVICE_ENCRYPTION_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - GATEWAY_URL=${GATEWAY_URL:?GATEWAY_URL is required}
    depends_on:
      postgres-auth:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${AUTH_SERVICE_PORT:-8081}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # LMS Core Service
  lms-core-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER is required}/edumind-lms-core-service:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: edumind-lms-core-service
    env_file: .env
    ports:
      - "127.0.0.1:${LMS_CORE_SERVICE_PORT:-8083}:${LMS_CORE_SERVICE_PORT:-8083}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LMS_CORE_SERVICE_PORT=${LMS_CORE_SERVICE_PORT:-8083}
      - LMS_CORE_DB_URL=jdbc:postgresql://postgres-lms-core:5432/${LMS_CORE_DB_NAME:-edumind_core}
      - LMS_CORE_DB_USERNAME=${LMS_CORE_DB_USERNAME:-postgres}
      - LMS_CORE_DB_PASSWORD=${LMS_CORE_DB_PASSWORD:?LMS_CORE_DB_PASSWORD is required}
      - LMS_CORE_DB_DRIVER=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - LMS_CORE_SERVICE_ENCRYPTION_KEY=${LMS_CORE_SERVICE_ENCRYPTION_KEY:?LMS_CORE_SERVICE_ENCRYPTION_KEY is required}
      - EUREKA_DEFAULT_ZONE=http://discovery-service:${DISCOVERY_SERVER_PORT:-8761}/eureka/
      - EUREKA_USERNAME=${EUREKA_USERNAME:?EUREKA_USERNAME is required}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - GATEWAY_URL=${GATEWAY_URL:?GATEWAY_URL is required}
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY:?PAYMENT_GATEWAY is required}
      - PAYMENT_MOCK_ENABLED=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      postgres-lms-core:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${LMS_CORE_SERVICE_PORT:-8083}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # API Gateway — start last
  api-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER is required}/edumind-api-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: edumind-api-gateway
    env_file: .env
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-8080}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-60000ms}
      - EUREKA_DEFAULT_ZONE=http://discovery-service:${DISCOVERY_SERVER_PORT:-8761}/eureka/
      - EUREKA_USERNAME=${EUREKA_USERNAME:?EUREKA_USERNAME is required}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}
      - ADMIN_URL=${ADMIN_URL:?ADMIN_URL is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - edumind-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${API_GATEWAY_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  discovery-logs:
    driver: local
  postgres-auth-data:
    driver: local
  postgres-lms-core-data:
    driver: local
  redis-data:
    driver: local

networks:
  edumind-network:
    driver: bridge
