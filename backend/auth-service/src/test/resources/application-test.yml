# Test Profile Configuration
# This profile uses PostgreSQL via Testcontainers for testing
# Datasource properties are injected dynamically by PostgresTestContainerConfig

spring:
  # JPA Configuration - Flyway manages schema, no ddl-auto
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway is enabled and configured by Testcontainer initializer
  # Default roles are inserted via V5__Insert_default_roles.sql
  flyway:
    enabled: true

  # Disable Eureka for tests
  cloud:
    discovery:
      enabled: false

  # Disable mail sending in tests
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

# Disable Eureka client registration for tests
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT Configuration (use test secret)
jwt:
  secret: test-secret-key-for-testing-only-minimum-32-characters-long
  expiration: 900000
  refresh-expiration: 604800000

# Disable email sending in tests
mail:
  enabled: false

# Disable Cloudinary in tests
cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

# Logging Configuration for tests
logging:
  level:
    root: WARN
    com.edumind: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: INFO
    com.github.dockerjava: WARN

# App Configuration
app:
  frontend:
    url: http://localhost:3000
  gateway:
    url: http://localhost:8080
  auth:
    email-verification-expiration: 86400000
    password-reset-expiration: 3600000
    token-expiration: 86400000
    refresh-expiration: 604800000
  cookie:
    secure: false
    same-site: Lax
  encryption:
    key: test-encryption-key-for-testing-only
