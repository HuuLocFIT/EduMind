<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{email/fragments/layout :: layout('There is an update on your EduMind teacher application.', 'Application decision', 'Teacher application update', ~{::#email-content})}"
>
  <body>
    <div id="email-content">
      <p
        style="
          margin: 0 0 16px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Hi <strong th:text="${name}" style="color: #0f172a">User</strong>,
      </p>
      <p
        style="
          margin: 0 0 22px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        We could not approve your teacher application in its current form.
      </p>
      <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
          margin: 0 0 24px;
          background-color: #fff7ed;
          border: 1px solid #fed7aa;
          border-radius: 12px;
        "
      >
        <tr>
          <td style="padding: 18px 20px">
            <p
              style="
                margin: 0 0 7px;
                color: #9a3412;
                font-size: 12px;
                line-height: 18px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.8px;
              "
            >
              Review note
            </p>
            <p
              th:text="${reason}"
              style="
                margin: 0;
                color: #7c2d12;
                font-size: 14px;
                line-height: 23px;
              "
            >
              Reason
            </p>
          </td>
        </tr>
      </table>
      <p
        style="
          margin: 0 0 20px;
          color: #475569;
          font-size: 14px;
          line-height: 23px;
        "
      >
        You may update your information and submit a new application.
      </p>
      <table
        class="mobile-full"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tr>
          <td bgcolor="#2563eb" style="border-radius: 10px">
            <a
              class="mobile-button"
              th:href="${actionUrl}"
              style="
                display: inline-block;
                padding: 14px 24px;
                color: #ffffff;
                font-size: 16px;
                line-height: 20px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 10px;
              "
              >Review and reapply</a
            >
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
