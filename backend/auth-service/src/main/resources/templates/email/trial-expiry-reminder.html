<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{email/fragments/layout :: layout('Your EduMind teacher trial is approaching its end date.', 'Teacher trial', 'Your trial is ending soon', ~{::#email-content})}"
>
  <body>
    <div id="email-content">
      <p
        style="
          margin: 0 0 16px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Hi <strong th:text="${name}" style="color: #0f172a">User</strong>,
      </p>
      <p
        style="
          margin: 0 0 22px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Your teacher trial ends in
        <strong><span th:text="${daysRemaining}">7</span> day(s)</strong>.
      </p>
      <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
          margin: 0 0 24px;
          background-color: #fffbeb;
          border: 1px solid #fde68a;
          border-radius: 12px;
        "
      >
        <tr>
          <td
            style="
              padding: 18px 20px;
              color: #78350f;
              font-size: 14px;
              line-height: 23px;
            "
          >
            <strong>Trial end date</strong><br /><span th:text="${trialEndDate}"
              >date</span
            >
          </td>
        </tr>
      </table>
      <p
        style="
          margin: 0 0 20px;
          color: #475569;
          font-size: 14px;
          line-height: 23px;
        "
      >
        If you need help understanding your account status, contact the EduMind
        support team.
      </p>
      <table
        class="mobile-full"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tr>
          <td bgcolor="#2563eb" style="border-radius: 10px">
            <a
              class="mobile-button"
              th:href="${actionUrl}"
              style="
                display: inline-block;
                padding: 14px 24px;
                color: #ffffff;
                font-size: 16px;
                line-height: 20px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 10px;
              "
              >Contact support</a
            >
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
