<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{email/fragments/layout :: layout('Use this secure link to verify your EduMind email address.', 'Account verification', 'Verify your email address', ~{::#email-content})}"
>
  <body>
    <div id="email-content">
      <p
        style="
          margin: 0 0 16px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Hi <strong th:text="${name}" style="color: #0f172a">User</strong>,
      </p>
      <p
        style="
          margin: 0 0 24px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        A new verification link was requested for your EduMind account. It
        expires in <strong>24 hours</strong>.
      </p>
      <table
        class="mobile-full"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin: 0 0 24px"
      >
        <tr>
          <td bgcolor="#2563eb" style="border-radius: 10px">
            <a
              class="mobile-button"
              th:href="${actionUrl}"
              style="
                display: inline-block;
                padding: 14px 24px;
                color: #ffffff;
                font-size: 16px;
                line-height: 20px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 10px;
              "
              >Verify email address</a
            >
          </td>
        </tr>
      </table>
      <p style="margin: 0; color: #64748b; font-size: 13px; line-height: 21px">
        If you did not request this link, no action is needed.
      </p>
      <p
        style="
          margin: 18px 0 6px;
          color: #64748b;
          font-size: 12px;
          line-height: 18px;
        "
      >
        Button not working? Copy and paste this secure link:
      </p>
      <p
        th:text="${actionUrl}"
        style="
          margin: 0;
          word-break: break-all;
          color: #2563eb;
          font-size: 12px;
          line-height: 18px;
        "
      >
        Verification URL
      </p>
    </div>
  </body>
</html>
