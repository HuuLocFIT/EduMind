<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{email/fragments/layout :: layout('Your EduMind password was changed successfully.', 'Security confirmation', 'Password changed', ~{::#email-content})}"
>
  <body>
    <div id="email-content">
      <p
        style="
          margin: 0 0 16px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Hi <strong th:text="${name}" style="color: #0f172a">User</strong>,
      </p>
      <p
        style="
          margin: 0 0 22px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Your password was changed successfully.
      </p>
      <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
          margin: 0 0 24px;
          background-color: #eff6ff;
          border: 1px solid #bfdbfe;
          border-radius: 12px;
        "
      >
        <tr>
          <td
            style="
              padding: 18px 20px;
              color: #1e3a8a;
              font-size: 14px;
              line-height: 23px;
            "
          >
            Other active sessions will require you to sign in again when their
            current access tokens expire.
          </td>
        </tr>
      </table>
      <p
        style="
          margin: 0 0 18px;
          color: #334155;
          font-size: 14px;
          line-height: 23px;
        "
      >
        <strong>Wasn't you?</strong> Reset your password immediately, then
        contact support.
      </p>
      <table
        class="mobile-full"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tr>
          <td bgcolor="#2563eb" style="border-radius: 10px">
            <a
              class="mobile-button"
              th:href="${frontendUrl + '/forgot-password'}"
              style="
                display: inline-block;
                padding: 13px 22px;
                color: #ffffff;
                font-size: 15px;
                line-height: 20px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 10px;
              "
              >Secure my account</a
            >
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
