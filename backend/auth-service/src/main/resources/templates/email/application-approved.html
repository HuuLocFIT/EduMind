<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{email/fragments/layout :: layout('Your EduMind teacher application has been approved.', 'Application decision', 'You are approved to teach', ~{::#email-content})}"
>
  <body>
    <div id="email-content">
      <table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin: 0 0 22px"
      >
        <tr>
          <td
            width="38"
            height="38"
            align="center"
            style="
              width: 38px;
              height: 38px;
              border-radius: 19px;
              background-color: #dcfce7;
              color: #166534;
              font-size: 20px;
              font-weight: 800;
            "
          >
            ✓
          </td>
        </tr>
      </table>
      <p
        style="
          margin: 0 0 16px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Hi <strong th:text="${name}" style="color: #0f172a">User</strong>,
      </p>
      <p
        style="
          margin: 0 0 22px;
          color: #334155;
          font-size: 16px;
          line-height: 26px;
        "
      >
        Your teacher application has been approved.
      </p>
      <table
        th:if="${isTrial}"
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
          margin: 0 0 24px;
          background-color: #eff6ff;
          border: 1px solid #bfdbfe;
          border-radius: 12px;
        "
      >
        <tr>
          <td
            style="
              padding: 18px 20px;
              color: #1e3a8a;
              font-size: 14px;
              line-height: 23px;
            "
          >
            <strong>Your 30-day teacher trial is active.</strong><br />Trial end
            date: <span th:text="${trialEndDate}">date</span>
          </td>
        </tr>
      </table>
      <table
        th:unless="${isTrial}"
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
          margin: 0 0 24px;
          background-color: #f0fdf4;
          border: 1px solid #bbf7d0;
          border-radius: 12px;
        "
      >
        <tr>
          <td
            style="
              padding: 18px 20px;
              color: #166534;
              font-size: 14px;
              line-height: 23px;
            "
          >
            <strong>Your full teacher access is active.</strong><br />You can
            now open the teacher workspace.
          </td>
        </tr>
      </table>
      <table
        class="mobile-full"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tr>
          <td bgcolor="#2563eb" style="border-radius: 10px">
            <a
              class="mobile-button"
              th:href="${actionUrl}"
              style="
                display: inline-block;
                padding: 14px 24px;
                color: #ffffff;
                font-size: 16px;
                line-height: 20px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 10px;
              "
              >Open teacher dashboard</a
            >
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
