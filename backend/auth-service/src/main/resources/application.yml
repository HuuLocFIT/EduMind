# Server Configuration
server:
  port: ${AUTH_SERVICE_PORT:8081}

# Spring Application Configuration
spring:
  application:
    # Service name - used to register with the Eureka Discovery Server
    # API Gateway and other services call this service by the name "auth-service"
    # Example: lb://AUTH-SERVICE in Gateway routes
    name: auth-service

  # Database Configuration
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/edumind_auth} # Structure: jdbc:postgresql://<host>:<port>/<database_name>
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: ${AUTH_DB_DRIVER:org.postgresql.Driver}

  # JPA Configuration
  jpa:
    hibernate:
      # DDL (Data Definition Language) auto strategy
      # validate - ONLY checks that the schema matches the entities, does NOT change the database
      # Other options:
      #   - none: Do nothing (manual control)
      #   - update: Auto-update the schema (NOT SAFE for production)
      #   - create: Drop and recreate the schema on every start (testing ONLY)
      #   - create-drop: Create on start, drop on stop (testing ONLY)
      # Use 'validate' because we manage the schema via Flyway migrations
      ddl-auto: validate

    # Show SQL queries in the console/log
    # Useful for debugging, learning how JPA works, performance tuning
    # Production: should be set to false since it impacts performance
    show-sql: true

    properties:
      hibernate:
        # PostgreSQL dialect - tells Hibernate how to generate SQL for PostgreSQL
        # Each database has different syntax:
        #   - PostgreSQL: SERIAL, LIMIT, OFFSET
        #   - MySQL: AUTO_INCREMENT, LIMIT
        #   - Oracle: SEQUENCE, ROWNUM
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # Format SQL for readability (line breaks, indentation)
        # Example:
        #   SELECT u.id, u.username FROM users u
        # Becomes:
        #   SELECT
        #       u.id,
        #       u.username
        #   FROM users u
        format_sql: true

        # Add comments to SQL to trace where a query came from
        # Example: /* load com.edumind.auth.entity.User */ SELECT ...
        # Useful when debugging or reading database query logs
        use_sql_comments: true

  # Flyway Configuration
  flyway:
    # Enable Flyway to manage database migrations
    # Flyway = Git for the database, tracks every schema change
    enabled: true

    # Create a baseline version for an already-existing database
    # If the database already has data/schema before adopting Flyway
    # Flyway will mark the current version as the baseline and only apply newer migrations
    # false - Flyway will error out if the database isn't empty
    baseline-on-migrate: true

    # Folder containing migration scripts
    # Structure:
    #   src/main/resources/db/migration/
    #     V1__Create_users_table.sql
    #     V2__Add_email_column.sql
    #     V3__Create_roles_table.sql
    # Naming convention: V{version}__{description}.sql
    #   - V1, V2, V3: Version numbers (increasing, must not repeat)
    #   - __: Two underscores (required)
    #   - Create_users_table: Description (use underscores instead of spaces)
    locations: classpath:db/migration

    schemas: public

  # Email Configuration (Gmail SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

  # Thymeleaf Configuration (for email templates)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # Multipart/File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          # Google OAuth2
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # Use gateway URL instead of {baseUrl} to avoid private IP issues
            # {baseUrl} resolves to private IP (192.168.x.x) which Google OAuth2 rejects
            # Uses app.gateway.url from config (can be overridden via GATEWAY_URL env var)
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/google}
            client-name: Google

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# Eureka Client Configuration
eureka:
  client:
    service-url:
      # Eureka Server URL (Service Registry)
      # Eureka = the "phonebook" of microservices
      # Auth Service registers here, API Gateway looks up Auth Service via Eureka
      # Port 8761 - the default Eureka Server port
      # URL contains no credentials. Eureka Server requires HTTP Basic, and
      # eureka-client-security attaches the Authorization header from edumind.eureka.security.*
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

    # Download the list of services from Eureka into the local cache
    # Auth Service needs this list to call other services
    # The cache is refreshed periodically (default: 30s)
    # false - the service won't know other services exist
    fetch-registry: true

    # Register this service with the Eureka Server
    # Process:
    #   1. Auth Service starts → sends info (name, IP, port, health URL) to Eureka
    #   2. Eureka stores it in the registry
    #   3. Sends a heartbeat every 30s → Eureka knows the service is alive
    #   4. If no heartbeat for 90s → Eureka removes the service from the registry
    # false - the service runs standalone, undiscoverable by others
    register-with-eureka: true

  instance:
    # Use the IP address instead of hostname when registering with Eureka
    # Why?
    #   - Docker/Kubernetes: the container hostname doesn't resolve from outside
    #   - Cloud: an IP is more reliable than a hostname (DNS issues)
    #   - Development: 192.168.1.100 is clearer than "my-laptop.local"
    # false - use the hostname (can cause connection problems)
    prefer-ip-address: true

    # Unique ID for the service instance
    # Format: auth-service:8081
    # Why does it need a unique ID?
    #   - A service can have multiple instances (horizontal scaling)
    #   - auth-service:8081, auth-service:8082, auth-service:8083
    #   - Eureka needs to distinguish each instance for load balancing
    # ${} - Spring Expression Language, pulls the value from config
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration
jwt:
  # Secret key used to sign and verify JWT tokens
  # JWT = Header + Payload + Signature
  # Signature = HMAC-SHA256(Header + Payload, secret)
  #
  # REQUIREMENTS:
  #   - HS256 algorithm: minimum 256 bits (32 characters)
  #   - Must be random, not predictable
  #   - Longer is more secure
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# Email Configuration
mail:
  from: ${MAIL_FROM:noreply@edumind.com}
  enabled: ${MAIL_ENABLED:true}  # Set to false to disable emails in dev

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Logging Configuration
logging:
  level:
    # Log level for all packages not explicitly specified
    # Log levels (from least to most detail):
    #   OFF > FATAL > ERROR > WARN > INFO > DEBUG > TRACE
    #
    # INFO - logs important events:
    #   - Application started
    #   - Configuration loaded
    #   - User registered/logged in
    #   - Scheduled jobs executed
    root: INFO

    # Log level for the project's own code (package com.edumind.*)
    # DEBUG - detailed for development and troubleshooting:
    #   - Method calls with parameters
    #   - Business logic flow
    #   - Calculations and conditions
    #   - Errors with stack traces
    # Production: should be lowered to INFO
    com.edumind: DEBUG

    # Log Spring Security filters and the authentication process
    # DEBUG helps troubleshoot:
    #   - Which security filters requests pass through
    #   - Authentication success/failure reasons
    #   - Authorization decisions (403 Forbidden)
    #   - JWT token parsing issues
    org.springframework.security: DEBUG

    # Log SQL statements executed by Hibernate
    # DEBUG shows SQL queries:
    #   SELECT * FROM users WHERE id = ?
    #   INSERT INTO users (username, email) VALUES (?, ?)
    # Unlike show-sql: logs through the logging framework (can be filtered)
    org.hibernate.SQL: DEBUG

    # Log parameters bound into SQL
    # TRACE shows the concrete values:
    #   binding parameter [1] as [BIGINT] - [123]
    #   binding parameter [2] as [VARCHAR] - [john@example.com]
    # Extremely useful for debugging SQL with wrong values
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  pattern:
    # Console log format (simple, for development)
    # %d{yyyy-MM-dd HH:mm:ss} - Timestamp: 2024-01-15 14:30:25
    # %msg - Log message content
    # %n - Newline
    # Output: 2024-01-15 14:30:25 - User logged in successfully
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

    # File log format (more detailed, for production)
    # %d{yyyy-MM-dd HH:mm:ss} - Timestamp
    # [%thread] - Thread name: [http-nio-8081-exec-1]
    # %-5level - Log level, 5 chars, left-aligned: INFO , DEBUG, ERROR
    # %logger{36} - Logger name (class), max 36 chars: c.e.a.service.AuthService
    # %msg - Log message
    # %n - Newline
    # Output: 2024-01-15 14:30:25 [http-nio-8081-exec-1] INFO  c.e.a.service.AuthService - User logged in
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    # Log file path - relative to application root directory
    # Structure:
    #   project-root/
    #     logs/
    #       auth-service.log (current log file)
    #       auth-service.log.2024-01-15.0 (archived)
    #       auth-service.log.2024-01-14.0 (archived)
    # Spring Boot automatically creates the 'logs' folder if it doesn't exist
    name: logs/auth-service.log

    # Maximum size of a single log file
    # Once it reaches 10MB → file rotation:
    #   1. auth-service.log → auth-service.log.2024-01-15.0
    #   2. Create a new auth-service.log
    # Why rotation is needed:
    #   - A file too large is hard to open and search
    #   - An editor can crash on a 1GB+ file
    #   - Easier backup and archiving
    max-size: 10MB

    # How many days to keep log files
    # After 30 days → old files are automatically deleted
    # Reasons:
    #   - Saves disk space
    #   - Compliance: regulations typically only require keeping logs 30-90 days
    #   - Troubleshooting: 30 days is enough to investigate issues
    # Production: can be increased to 90 days or archived to S3/cloud storage
    max-history: 30
    
# Scheduling Configuration
spring.task.scheduling:
  pool:
    size: 2
  thread-name-prefix: scheduler-

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 1. Health Check - /actuator/health
#    - Used by: API Gateway, Kubernetes, Load Balancer
#    - Purpose: check whether the service is alive and healthy
#    - Response: {"status": "UP"} or {"status": "DOWN"}
#    - Components checked: Database, Disk space, Custom health indicators
#
# 2. Info - /actuator/info
#    - Used by: Developers, Operations team
#    - Purpose: information about the application
#    - Content: Version, build time, git commit, description
#    - Configured in pom.xml (build-info) or application.yml
#
# 3. Metrics - /actuator/metrics
#    - Used by: Monitoring tools (Prometheus, Grafana)
#    - Purpose: application performance and usage metrics
#    - Available metrics:
#      * jvm.memory.used - JVM memory usage
#      * jvm.memory.max - Maximum JVM memory
#      * http.server.requests - HTTP request count and duration
#      * hikaricp.connections.active - Active database connections
#      * Custom metrics: users.registered.total, orders.created.total
#    - Prometheus format: /actuator/prometheus (if micrometer-registry-prometheus is present)

app:
  # Frontend URL for email links
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  # Gateway URL for OAuth2 redirect URIs
  # Use this instead of {baseUrl} to avoid private IP issues
  # In production, set GATEWAY_URL environment variable (e.g., https://api.yourdomain.com)
  gateway:
    url: ${GATEWAY_URL:http://localhost:8080}

  # Authentication Configuration
  auth:
    # Email verification token expiration (24 hours in milliseconds)
    email-verification-expiration: 86400000
    email-verification-resend-window-minutes: ${EMAIL_VERIFICATION_RESEND_WINDOW_MINUTES:60}
    email-verification-resend-max: ${EMAIL_VERIFICATION_RESEND_MAX:3}
    enforce-email-verification: ${ENFORCE_EMAIL_VERIFICATION:true}
    # Fail closed: enabled explicitly only for local/E2E account seeding.
    dev-verify-endpoint-enabled: ${DEV_VERIFY_ENDPOINT_ENABLED:false}

    # Password reset token expiration (1 hour in milliseconds)
    password-reset-expiration: 3600000

    # Token expiration (duplicated for clarity)
    token-expiration: 86400000
    refresh-expiration: 604800000

    # Password reset request rate limiter (see PasswordResetRateLimiter)
    # Dedicated HMAC secret used to hash emails into rate-limit bucket keys.
    # Distinct from AUTH_SERVICE_ENCRYPTION_KEY - do not reuse it.
    password-reset-limiter:
      hmac-key: ${PASSWORD_RESET_LIMITER_HMAC_KEY}

  # Cookie settings for refresh token
  cookie:
    # Set to true in production (HTTPS required)
    secure: ${COOKIE_SECURE:false}
    # SameSite policy: Strict, Lax, or None
    # Use "Lax" for same-site requests
    # Use "None" for cross-origin (requires secure=true)
    same-site: ${COOKIE_SAME_SITE:Lax}

  # PRODUCTION
  # app:
  #   cookie:
  #     secure: true
  #     same-site: Strict

  # Encryption Configuration
  encryption:
    key: ${AUTH_SERVICE_ENCRYPTION_KEY}

    


# Credentials sent to the Eureka Server via the Authorization header (see eureka-client-security module).
# Leaving username blank makes the client behave as before, with no authentication.
# The eureka/eureka default is only for the dev environment; the prod profile
# (application-prod.yml) requires EUREKA_USERNAME/EUREKA_PASSWORD and fails to start if missing.
edumind:
  eureka:
    security:
      username: ${EUREKA_USERNAME:eureka}
      password: ${EUREKA_PASSWORD:eureka}
