name: Frontend Release

# Separate from frontend-ci.yml which runs on feature branches / PRs.
# Source maps only make sense when code is running in production.
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  release:
    name: Build & Upload Source Maps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate release version from git SHA
        id: version
        run: echo "RELEASE_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Inject the real version into Angular environment.prod.ts before build
      # Angular cannot read env vars at runtime — sed is the standard approach
      - name: Inject version into Angular environment
        run: |
          sed -i "s/appVersion: '0.0.0'/appVersion: '${{ steps.version.outputs.RELEASE_VERSION }}'/" \
            apps/admin/src/environments/environment.prod.ts

      - name: Build all projects (production + source maps enabled)
        run: npx nx run-many --target=build --all --parallel=2
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}

      # Guard: only upload if the dist directory exists
      # (nx affected may skip an app if nothing changed)
      - name: Upload source maps - User Portal
        run: |
          if [ ! -d "./dist/apps/user" ]; then
            echo "No user build found, skipping source map upload"
            exit 0
          fi
          npx @sentry/cli releases new "edumind-user@${{ steps.version.outputs.RELEASE_VERSION }}"
          npx @sentry/cli sourcemaps upload \
            --release "edumind-user@${{ steps.version.outputs.RELEASE_VERSION }}" \
            --url-prefix '~/' \
            ./dist/apps/user
          npx @sentry/cli releases finalize "edumind-user@${{ steps.version.outputs.RELEASE_VERSION }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: edumind
          SENTRY_PROJECT: edumind-user

      - name: Upload source maps - Admin Panel
        run: |
          if [ ! -d "./dist/apps/admin" ]; then
            echo "No admin build found, skipping source map upload"
            exit 0
          fi
          npx @sentry/cli releases new "edumind-admin@${{ steps.version.outputs.RELEASE_VERSION }}"
          npx @sentry/cli sourcemaps upload \
            --release "edumind-admin@${{ steps.version.outputs.RELEASE_VERSION }}" \
            --url-prefix '~/' \
            ./dist/apps/admin
          npx @sentry/cli releases finalize "edumind-admin@${{ steps.version.outputs.RELEASE_VERSION }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: edumind
          SENTRY_PROJECT: edumind-admin

      # Remove source maps from deploy artifacts after upload
      # Must run after upload, before deploy — users should not be able to download original source
      - name: Remove source maps from deploy artifacts
        run: find ./dist -name "*.map" -delete

      # Add your deploy step here
