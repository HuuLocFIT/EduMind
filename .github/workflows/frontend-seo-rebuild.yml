name: Frontend SEO Rebuild

on:
  workflow_dispatch:

concurrency:
  group: frontend-seo-rebuild
  cancel-in-progress: true

jobs:
  trigger_user_prerender:
    name: Trigger user portal prerender
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-frontend
    permissions: {}
    steps:
      - name: Trigger the Vercel user deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi

          http_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --request POST "$VERCEL_DEPLOY_HOOK_URL")"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Vercel rejected the SEO rebuild request (HTTP $http_code)." >&2
            exit 1
          fi
          echo "User portal SEO rebuild accepted by Vercel (HTTP $http_code)."
